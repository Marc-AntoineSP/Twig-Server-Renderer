name: Verify local application and portable packages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 tag
      - run: make bootstrap check test browser consumer
      - run: make prod-init prod-build prod-migrate prod-up prod-check
      - run: bash tests/Production/run.sh
      - if: failure()
        run: docker compose ps --all && docker compose logs --tail=50 app preview-consumer build-worker render-worker
      - if: always()
        run: docker compose down && make prod-down
