name: Verify local application and portable packages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 tag
      - run: python3 tests/BrowserHarness/run.py run --with-checks
      - run: make profile-production
      # Legacy consumer/recovery drivers fail closed until moved to owned resources.
      # Each harness cleans its exact project on success, failure and termination.
