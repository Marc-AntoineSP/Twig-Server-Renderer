security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
    role_hierarchy:
        ROLE_ADMIN: ROLE_EDITOR
        ROLE_EDITOR: ROLE_READER
    providers:
        studio_users:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: studio_users
            user_checker: App\Security\UserChecker
            form_login:
                login_path: studio_login
                check_path: studio_login
                enable_csrf: true
                default_target_path: studio_home
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            logout:
                path: studio_logout
                target: studio_login
                enable_csrf: true
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/health(?:/ready)?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/items, roles: ROLE_EDITOR, methods: [POST, PUT, PATCH, DELETE] }
        - { path: ^/, roles: ROLE_READER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
