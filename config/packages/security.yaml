security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
    role_hierarchy:
        ROLE_ADMIN: ROLE_EDITOR
        ROLE_EDITOR: ROLE_READER
    providers:
        studio_users:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        compose_mcp:
            pattern: ^/mcp/compose/?$
            stateless: true
            custom_authenticators: [App\Mcp\Security\ComposeAuthenticator]
        oauth_public:
            pattern: ^/(?:oauth2/compose/(?:token|register)$|\.well-known/oauth-(?:authorization-server|protected-resource)(?:/|$))
            security: false
        registry:
            pattern: ^/api/v1/registry/
            stateless: true
            custom_authenticators: [App\Security\RegistryAuthenticator]
        main:
            lazy: true
            provider: studio_users
            user_checker: App\Security\UserChecker
            form_login:
                login_path: studio_login
                check_path: studio_login
                enable_csrf: true
                default_target_path: studio_home
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            logout:
                path: studio_logout
                target: studio_login
                enable_csrf: true
    access_control:
        - { path: '^/mcp/compose/?$', roles: IS_AUTHENTICATED_FULLY }
        - { path: '^/oauth2/compose/authorize$', roles: PUBLIC_ACCESS }
        - { path: '^/oauth2/compose/consent$', roles: ROLE_EDITOR }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/health(?:/ready|/browser-run)?$, roles: PUBLIC_ACCESS }
        - { path: ^/(?:api/v1/appearance(?:/|$)|appearance/assets/), roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/items, roles: ROLE_EDITOR, methods: [POST, PUT, PATCH, DELETE] }
        - { path: ^/api/v1/preview-jobs, roles: ROLE_EDITOR }
        - { path: ^/api/v1/themes, roles: ROLE_EDITOR, methods: [POST, PUT, DELETE] }
        - { path: ^/, roles: ROLE_READER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
