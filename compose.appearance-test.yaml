# Isolated production acceptance tools; deliberately no inherited development networks.
services:
  browser:
    image: styleguide-browser-runner:local
    build: {context: ., dockerfile: tests/BrowserHarness/Dockerfile}
    profiles: [tools]
    working_dir: /app
    init: true
    shm_size: 1gb
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    networks: [edge]
    environment:
      STUDIO_BASE_URL: http://studio:8080
      APPEARANCE_PRODUCTION: "1"
    tmpfs: [/app/var:mode=1777]
