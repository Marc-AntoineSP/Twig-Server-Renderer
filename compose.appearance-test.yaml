# Isolated production acceptance tools; deliberately no inherited development networks.
services:
  browser:
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    profiles: [tools]
    working_dir: /app
    init: true
    ipc: host
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    networks: [edge]
    environment:
      STUDIO_BASE_URL: http://studio:8080
      APPEARANCE_PRODUCTION: "1"
    volumes: ["./:/app"]
